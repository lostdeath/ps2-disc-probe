name: PS4 Minimal Launch Control
on:
  push:
    paths:
      - .github/workflows/ps4-minimal-launch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal independent launch test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 scripts/generate_icon.py out/minpkg/sce_sys/icon0.png
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work openorbisofficial/toolchain:latest bash -lc '
            set -euo pipefail
            SDK=/lib/OpenOrbisSDK
            TOOL="$SDK/bin/linux/PkgTool.Core"
            mkdir -p out/minpkg/sce_sys out/minpkg/sce_module
            cat > out/minimal.c <<EOF
          int main(void) {
            volatile unsigned long x = 0;
            for (unsigned long i = 0; i < 1000000UL; i++) x += i;
            return (int)(x == 0);
          }
          EOF
            clang --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -isysroot "$SDK" -isystem "$SDK/include" -c out/minimal.c -o out/minimal.o
            ld.lld -m elf_x86_64 -pie --script "$SDK/link.x" --eh-frame-hdr -L"$SDK/lib" out/minimal.o -o out/minimal.elf -lc -lkernel -lc++ "$SDK/lib/crt1.o"
            "$SDK/bin/linux/create-eboot" -in out/minimal.elf -out out/minpkg/eboot.bin -ptype fake
            cp "$SDK/bin/data/modules/libc.prx" out/minpkg/sce_module/
            cp "$SDK/bin/data/modules/libSceFios2.prx" out/minpkg/sce_module/
            "$TOOL" sfo_new out/minpkg/sce_sys/param.sfo
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo APP_TYPE --type Integer --maxsize 4 --value 1
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo APP_VER --type Utf8 --maxsize 8 --value "01.00"
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo ATTRIBUTE --type Integer --maxsize 4 --value 0
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo CATEGORY --type Utf8 --maxsize 4 --value "gd"
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo CONTENT_ID --type Utf8 --maxsize 48 --value "IV0000-BREW00992_00-MINIMALTEST00000"
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo DOWNLOAD_DATA_SIZE --type Integer --maxsize 4 --value 0
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo SYSTEM_VER --type Integer --maxsize 4 --value 0
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo TITLE --type Utf8 --maxsize 128 --value "PS4 Minimal Launch Test"
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo TITLE_ID --type Utf8 --maxsize 12 --value "BREW00992"
            "$TOOL" sfo_setentry out/minpkg/sce_sys/param.sfo VERSION --type Utf8 --maxsize 8 --value "01.00"
            cat > out/minimal.gp4 <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <psproject fmt="gp4" version="1000">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2026-10-12 00:00:00</volume_ts>
              <package content_id="IV0000-BREW00992_00-MINIMALTEST00000" passcode="00000000000000000000000000000000" storage_type="digital50" app_type="full"/>
              <chunk_info chunk_count="1" scenario_count="1">
                <chunks><chunk id="0" layer_no="0" label="Chunk #0"/></chunks>
                <scenarios default_id="0"><scenario id="0" type="sp" initial_chunk_count="1" label="Scenario #0">0</scenario></scenarios>
              </chunk_info>
            </volume>
            <files img_no="0">
              <file targ_path="eboot.bin" orig_path="minpkg/eboot.bin"/>
              <file targ_path="sce_sys/param.sfo" orig_path="minpkg/sce_sys/param.sfo"/>
              <file targ_path="sce_sys/icon0.png" orig_path="minpkg/sce_sys/icon0.png"/>
              <file targ_path="sce_module/libc.prx" orig_path="minpkg/sce_module/libc.prx"/>
              <file targ_path="sce_module/libSceFios2.prx" orig_path="minpkg/sce_module/libSceFios2.prx"/>
            </files>
            <rootdir><dir targ_name="sce_sys"/><dir targ_name="sce_module"/></rootdir>
          </psproject>
          EOF
            cd out
            "$TOOL" pkg_build minimal.gp4 .
            find . -maxdepth 1 -name "*.pkg" -print -exec "$TOOL" pkg_validate {} \;
            test -n "$(find . -maxdepth 1 -name "*.pkg" -print -quit)"
          '
      - name: Upload independent launch control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-minimal-launch-control
          path: |
            out/*.pkg
            out/*.gp4
            out/minimal.elf
            out/minpkg/eboot.bin
            out/minpkg/sce_sys/icon0.png
