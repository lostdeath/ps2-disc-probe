name: Build PS4 Disc Probe PKG
on:
  push:
    paths:
      - .github/workflows/ps4-build-pkg.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package disc probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 scripts/generate_icon.py out/pkgroot/sce_sys/icon0.png
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work openorbisofficial/toolchain:latest bash -lc '
            set -euo pipefail
            SDK=/lib/OpenOrbisSDK
            clang --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -isysroot "$SDK" -isystem "$SDK/include" -c src/disc_probe.c -o out/probe.o
            cat > out/process_param.c <<EOF
          __attribute__((used,section(".data.sce_process_param"),aligned(8)))
          unsigned long long ps2_probe_process_param[3] = {0x18ULL,0x13C13F4BFULL,0x1000051ULL};
          EOF
            clang --target=x86_64-pc-freebsd12-elf -fPIC -isysroot "$SDK" -c out/process_param.c -o out/process_param.o
            ld.lld -m elf_x86_64 -pie --script "$SDK/link.x" --eh-frame-hdr -L"$SDK/lib" out/probe.o out/process_param.o -o out/probe.elf -lc -lkernel -lc++ "$SDK/lib/crt1.o"
            mkdir -p out/pkgroot/sce_sys out/pkgroot/sce_module
            cp "$SDK/bin/data/modules/libc.prx" out/pkgroot/sce_module/libc.prx
            cp "$SDK/bin/data/modules/libSceFios2.prx" out/pkgroot/sce_module/libSceFios2.prx
            "$SDK/bin/linux/create-eboot" -in out/probe.elf -out out/pkgroot/eboot.bin -ptype fake -paid 4035225266123964433
            "$SDK/bin/linux/readelf" -h out/probe.elf
            "$SDK/bin/linux/readelf" -l out/probe.elf
            TOOL="$SDK/bin/linux/PkgTool.Core"
            "$TOOL" sfo_new out/pkgroot/sce_sys/param.sfo
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo APP_TYPE --type Integer --maxsize 4 --value 1
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo APP_VER --type Utf8 --maxsize 8 --value "01.00"
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo ATTRIBUTE --type Integer --maxsize 4 --value 0
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo CATEGORY --type Utf8 --maxsize 4 --value "gd"
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo CONTENT_ID --type Utf8 --maxsize 48 --value "IV0000-BREW00991_00-PS2DISCPROBE0000"
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo DOWNLOAD_DATA_SIZE --type Integer --maxsize 4 --value 0
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo SYSTEM_VER --type Integer --maxsize 4 --value 0
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo TITLE --type Utf8 --maxsize 128 --value "PS2 Disc Probe"
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo TITLE_ID --type Utf8 --maxsize 12 --value "BREW00991"
            "$TOOL" sfo_setentry out/pkgroot/sce_sys/param.sfo VERSION --type Utf8 --maxsize 8 --value "01.00"
            "$TOOL" sfo_listentries out/pkgroot/sce_sys/param.sfo
            cat > out/disc-probe.gp4 <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <psproject fmt="gp4" version="1000">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>PS4VOLUME</volume_id>
              <volume_ts>2026-10-12 00:00:00</volume_ts>
              <package content_id="IV0000-BREW00991_00-PS2DISCPROBE0000" passcode="00000000000000000000000000000000" storage_type="digital50" app_type="full"/>
              <chunk_info chunk_count="1" scenario_count="1">
                <chunks><chunk id="0" layer_no="0" label="Chunk #0"/></chunks>
                <scenarios default_id="0"><scenario id="0" type="sp" initial_chunk_count="1" label="Scenario #0">0</scenario></scenarios>
              </chunk_info>
            </volume>
            <rootdir>
              <dir targ_name="sce_sys"/>
              <dir targ_name="sce_module"/>
            </rootdir>
            <files img_no="0">
              <file targ_path="eboot.bin" orig_path="pkgroot/eboot.bin"/>
              <file targ_path="sce_sys/param.sfo" orig_path="pkgroot/sce_sys/param.sfo"/>
              <file targ_path="sce_sys/icon0.png" orig_path="pkgroot/sce_sys/icon0.png"/>
              <file targ_path="sce_module/libc.prx" orig_path="pkgroot/sce_module/libc.prx"/>
              <file targ_path="sce_module/libSceFios2.prx" orig_path="pkgroot/sce_module/libSceFios2.prx"/>
            </files>
          </psproject>
          EOF
            cd out
            "$TOOL" pkg_build disc-probe.gp4 .
            find . -maxdepth 2 -type f -name "*.pkg" -exec "$TOOL" pkg_validate {} \;
            test -n "$(find . -maxdepth 2 -type f -name "*.pkg" -print -quit)"
          '
      - name: Upload PKG or diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-disc-probe-pkg-attempt
          path: |
            out/*.pkg
            out/*.gp4
            out/probe.elf
            out/pkgroot/eboot.bin
            out/pkgroot/sce_sys/param.sfo
            out/pkgroot/sce_sys/icon0.png
