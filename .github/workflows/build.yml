name: Build PS4 Test Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download OpenOrbis toolchain samples
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git toolchain-src

      - name: Build and package sample
        run: |
          set -e
          docker run --rm \
            -w /workspace \
            -v "$GITHUB_WORKSPACE/toolchain-src/samples:/workspace" \
            openorbisofficial/toolchain:latest \
            bash -c 'cd hello_world && make && PkgTool.Core pkg_build pkg/pkg.gp4 .'

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps4-test-package
          path: toolchain-src/samples/hello_world/*.pkg
          if-no-files-found: error
