name: PS4 Build Preparation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable disc probe
        run: make CC=gcc CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2"
      - name: Verify source recognizes PS2 disc markers
        run: |
          mkdir -p test-disc
          touch test-disc/SYSTEM.CNF test-disc/SLUS_123.45
          ./disc-probe test-disc | tee probe-results.txt
          grep -q 'PS2 marker.*SYSTEM.CNF' probe-results.txt
          grep -q 'PS2 marker.*SLUS_123.45' probe-results.txt
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: source-validation-not-a-ps4-pkg
          path: probe-results.txt
